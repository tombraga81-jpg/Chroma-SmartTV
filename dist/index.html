<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CromaTV</title>
<style>
html{font-size:.8333vw}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0A0B0E;color:#F4F5F7;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
#boot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:#0A0B0E;color:#fff;text-align:center;padding-top:30vh;font-size:3rem;font-weight:bold}
#boot small{display:block;font-size:1.4rem;font-weight:normal;color:#9aa0aa;margin-top:1rem}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;background:#0A0B0E}
#side{width:16rem;margin:1rem;flex:none;background:#141418;border:1px solid rgba(255,255,255,.14);border-radius:1.4rem;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;min-width:0;position:relative;overflow:hidden}
.hide{display:none!important}
.f{outline:none;cursor:pointer}
.f:focus{outline:.2rem solid #fff;outline-offset:.15rem}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.2rem .9rem;border-bottom:1px solid rgba(255,255,255,.08)}
.side-top b{font-size:1.15rem}
.side-top span{font-size:.95rem;color:#cfd3da;font-family:monospace}
.nav{padding:.7rem .7rem 0;flex:1;overflow:hidden}
.navi{display:block;width:100%;text-align:left;padding:.75rem 1rem;margin-bottom:.3rem;border-radius:.8rem;font-size:1.15rem;color:#d4d7dd;background:transparent;border:0;font-family:inherit}
.navi i{display:inline-block;width:1.6rem;font-style:normal;opacity:.8}
.navi.on{background:#fff;color:#000;font-weight:bold}
.pls{border-top:1px solid rgba(255,255,255,.08);padding:.6rem .7rem .8rem}
.pls p{margin:.2rem 0 .4rem 1rem;font-size:.9rem;color:#9aa0aa}
.pli{display:block;width:100%;text-align:left;padding:.55rem .8rem;margin-bottom:.3rem;border-radius:.8rem;border:0;background:rgba(255,255,255,.05);color:#e6e8ec;font-family:inherit;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli.on{background:rgba(255,255,255,.16);font-weight:bold}
.pli em{display:inline-block;width:1.3rem;height:1.3rem;line-height:1.3rem;text-align:center;border-radius:.4rem;background:#e11d48;color:#fff;font-style:normal;font-size:.8rem;margin-right:.55rem;font-weight:bold}
.addb{display:block;width:100%;padding:.65rem;border-radius:.8rem;border:1px solid rgba(255,255,255,.18);background:transparent;color:#e6e8ec;font-family:inherit;font-size:.95rem;margin-top:.2rem}
.page{height:100%;overflow:hidden;position:relative}
.pad{padding:1.2rem 2rem 6rem 1rem}
h2.t{font-size:1.6rem;margin:1.6rem 0 .5rem 0;font-weight:bold}
.sub{color:#9aa0aa;font-size:1rem}
.hero{position:relative;height:30rem;border-radius:1.6rem;overflow:hidden;margin-bottom:.5rem;background:#1a1c24}
.hero .bg{position:absolute;left:0;top:0;width:100%;height:100%}
.hero .shade{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,rgba(10,11,14,.95) 0%,rgba(10,11,14,.7) 45%,rgba(10,11,14,.15) 100%)}
.hero .pos{position:absolute;right:3rem;top:2.5rem;width:16rem;height:24rem;border-radius:1rem;overflow:hidden;box-shadow:0 1rem 3rem rgba(0,0,0,.6);background:#222}
.hero .tx{position:absolute;left:3rem;bottom:2.6rem;width:50%}
.hero .kick{font-size:1rem;color:#d4d7dd;margin-bottom:.8rem}
.hero h1{font-size:3.6rem;margin:0 0 .8rem;line-height:1.05}
.hero p{font-size:1.15rem;line-height:1.45;color:#dfe2e8;margin:0 0 1.4rem;max-height:5.2rem;overflow:hidden}
.btn{display:inline-block;padding:.75rem 1.6rem;border-radius:.8rem;font-size:1.1rem;font-weight:bold;border:0;font-family:inherit;margin-right:.8rem;background:rgba(255,255,255,.14);color:#fff}
.btn.pri{background:#fff;color:#000}
.btn.red{background:#e11d48;color:#fff}
.btn:focus{background:#fff;color:#000}
.btn.red:focus{background:#ff4d79;color:#fff}
.rail{overflow:hidden;white-space:nowrap;padding:.6rem .4rem .8rem .4rem;margin-left:-.4rem}
.card{display:inline-block;vertical-align:top;white-space:normal;margin-right:1.2rem;width:12rem;position:relative}
.card .pic{position:relative;width:100%;height:18rem;border-radius:1rem;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#1b1d25}
.card.land{width:16rem}
.card.land .pic{height:9rem}
.card .ph{position:absolute;left:0;top:0;width:100%;height:100%;padding:.8rem;font-size:1.05rem;font-weight:bold;color:rgba(255,255,255,.85);text-align:center;display:flex;align-items:center;justify-content:center;word-break:break-word}
.card .im{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.card.land .im{object-fit:contain;padding:1rem}
.card .nm{margin-top:.5rem;font-size:1rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sb{font-size:.85rem;color:#9aa0aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bar{position:absolute;left:.7rem;right:.7rem;bottom:.7rem;height:.35rem;border-radius:.2rem;background:rgba(255,255,255,.25)}
.card .bar i{display:block;height:100%;background:#fff;border-radius:.2rem}
.card:focus{transform:scale(1.05);z-index:2}
.chips{white-space:nowrap;overflow:hidden;padding:.5rem .4rem .6rem .4rem;margin-left:-.4rem}
.chip{display:inline-block;margin-right:.6rem;padding:.55rem 1.1rem;border-radius:2rem;background:rgba(255,255,255,.08);color:#dfe2e8;font-size:1rem;border:0;font-family:inherit}
.chip.on{background:#fff;color:#000;font-weight:bold}
.grid{white-space:normal;padding:.6rem .4rem;margin-left:-.4rem}
.grid .card{margin-bottom:1.6rem}
.live{display:flex;height:100%;padding:1.2rem 1rem 0 1rem}
.live .cats{width:19rem;flex:none;overflow:hidden;padding:.3rem .4rem;margin-left:-.4rem}
.live .chs{flex:1;overflow:hidden;padding:.3rem .4rem 4rem .4rem;margin-left:1rem}
.row{display:flex;align-items:center;padding:.6rem 1rem;margin-bottom:.45rem;border-radius:.9rem;background:rgba(255,255,255,.06);font-size:1.1rem;border:0;width:100%;color:#fff;font-family:inherit;text-align:left}
.row.on{background:rgba(255,255,255,.18);font-weight:bold}
.row .n{width:4rem;flex:none;color:#9aa0aa;font-family:monospace}
.row .lg{width:4.4rem;height:2.8rem;flex:none;margin-right:1rem;position:relative}
.row .lg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{flex:none;color:#9aa0aa;font-size:.95rem;margin-left:1rem}
.row:focus{background:#fff;color:#000;outline:none}
.row:focus .n,.row:focus .rt{color:#444}
.inp{width:100%;height:3.4rem;border-radius:.9rem;border:1px solid rgba(255,255,255,.2);background:#0f1116;color:#fff;font-size:1.2rem;padding:0 1.1rem;font-family:inherit;margin-bottom:.9rem}
.inp:focus{border-color:#e11d48;outline:.15rem solid #fff}
label.lb{display:block;font-size:.95rem;color:#c3c7ce;margin:.2rem 0 .35rem}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center}
.panel{width:62rem;max-height:92vh;background:#12141A;border:1px solid rgba(255,255,255,.12);border-radius:1.6rem;overflow:hidden;position:relative}
.panel.sm{width:44rem}
.ph1{padding:1.3rem 1.8rem;border-bottom:1px solid rgba(255,255,255,.08);font-size:1.5rem;font-weight:bold}
.pbody{padding:1.5rem 1.8rem;overflow:hidden;max-height:70vh}
.dflex{display:flex}
.dpos{width:15rem;height:22.5rem;flex:none;border-radius:1rem;overflow:hidden;position:relative;background:#222;margin-right:2rem}
.dinfo{flex:1;min-width:0}
.dinfo h2{margin:0 0 .5rem;font-size:2.2rem}
.dinfo p{font-size:1.1rem;line-height:1.5;color:#d4d7dd;max-height:9rem;overflow:hidden}
.eps{max-height:26rem;overflow:hidden;margin-top:.6rem;padding:.3rem}
.msg{color:#ff8aa5;font-size:1rem;margin:.4rem 0 .8rem;min-height:1.2rem}
#toast{position:fixed;left:50%;bottom:3rem;transform:translateX(-50%);background:rgba(30,32,40,.97);border:1px solid rgba(255,255,255,.2);padding:.9rem 1.6rem;border-radius:1rem;font-size:1.1rem;z-index:200;max-width:60rem}
#loading{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:90;text-align:center;padding-top:34vh;font-size:1.4rem}
.spin{width:4rem;height:4rem;border:.4rem solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 1.2rem;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#player{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:80}
#video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#pTop{position:absolute;left:0;top:0;right:0;padding:2rem 3rem 4rem;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
#pTop b{font-size:2rem;display:block}
#pTop span{font-size:1.1rem;color:#cfd3da}
#pBot{position:absolute;left:0;bottom:0;right:0;padding:4rem 3rem 2rem;background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,0))}
#pBar{height:.5rem;border-radius:.3rem;background:rgba(255,255,255,.25);overflow:hidden}
#pFill{height:100%;width:0;background:#e11d48}
#pTime{display:flex;justify-content:space-between;font-size:1.1rem;margin-top:.6rem;color:#e6e8ec}
#pHint{font-size:.95rem;color:#9aa0aa;margin-top:.5rem}
#pSpin{position:absolute;left:50%;top:50%;margin:-2rem 0 0 -2rem}
#pMsg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:1.5rem;padding:0 6rem}
#err{position:fixed;left:0;right:0;bottom:0;max-height:30vh;overflow:hidden;margin:0;background:#5a0a1c;color:#fff;font-size:1rem;padding:.8rem 1.2rem;z-index:300;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot">CromaTV<small>Carregando…</small></div>
<div id="app"><div id="side"></div><div id="main"></div></div>
<div id="modal" class="modal hide"></div>
<div id="loading" class="hide"><div class="spin"></div><div id="loadmsg"></div></div>
<div id="player" class="hide">
  <video id="video" autoplay></video>
  <div id="pSpin" class="spin hide"></div>
  <div id="pMsg" class="hide"></div>
  <div id="pTop"><b id="pTitle"></b><span id="pSub"></span></div>
  <div id="pBot"><div id="pBar"><div id="pFill"></div></div><div id="pTime"><span id="pCur">0:00</span><span id="pDur"></span></div><div id="pHint"></div></div>
</div>
<div id="toast" class="hide"></div>
<pre id="err" class="hide"></pre>
<script>
(function () {
"use strict";
var VERSION = "2.0";

/* ---------- erro na tela (ajuda a diagnosticar na TV) ---------- */
function showErr(msg) {
  var e = document.getElementById("err");
  if (!e) return;
  e.className = "";
  e.textContent = "Erro: " + msg + "\n(CromaTV " + VERSION + ")";
}
window.onerror = function (m, u, l, c) { showErr(m + " [linha " + l + ":" + c + "]"); };

/* ---------- utilidades ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function jget(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function enc(s) { return encodeURIComponent(s); }
function hash(s) { var x = 0, i; s = String(s || ""); for (i = 0; i < s.length; i++) { x = ((x << 5) - x + s.charCodeAt(i)) | 0; } return Math.abs(x); }
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtTime(t) {
  if (!isFinite(t) || t < 0) return "0:00";
  t = Math.floor(t);
  var hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60;
  return (hh ? hh + ":" + pad2(mm) : mm) + ":" + pad2(ss);
}
function isArr(a) { return Object.prototype.toString.call(a) === "[object Array]"; }

var toastT = null;
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg; t.className = "";
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.className = "hide"; }, 3500);
}

/* ---------- estado ---------- */
var S = {
  section: "home", playlists: [], activeId: null, lib: null,
  libCache: {}, cw: [], settings: { proxy: "" }, loadToken: 0
};
var demoPl = { id: "demo", type: "demo", name: "Catálogo Demonstração" };

function savePlaylists() { jset("croma.pl", S.playlists); jset("croma.active", S.activeId); }
function saveCW() { jset("croma.cw", S.cw); }
function saveSettings() { jset("croma.set", S.settings); }
function allPlaylists() { return S.playlists.concat([demoPl]); }
function activePl() {
  var a = allPlaylists(), i;
  for (i = 0; i < a.length; i++) { if (a[i].id === S.activeId) return a[i]; }
  return demoPl;
}

/* ---------- rede ---------- */
function xhr(url, cb) {
  var x = new XMLHttpRequest(), done = false;
  function fin(err, t) { if (done) return; done = true; cb(err, t); }
  try { x.open("GET", url, true); } catch (e) { fin({ status: 0, msg: String(e) }); return; }
  x.timeout = 90000;
  x.onload = function () {
    if (x.status >= 200 && x.status < 300) fin(null, x.responseText);
    else fin({ status: x.status, msg: "HTTP " + x.status });
  };
  x.onerror = function () { fin({ status: 0, msg: "rede" }); };
  x.ontimeout = function () { fin({ status: 0, msg: "tempo esgotado" }); };
  try { x.send(); } catch (e2) { fin({ status: 0, msg: String(e2) }); }
}
function fetchText(url, cb) {
  var tries = [url], i = 0, last = null;
  if (/^http:/i.test(url) && location.protocol === "https:") tries.push(url.replace(/^http:/i, "https:"));
  if (S.settings.proxy) tries.push(S.settings.proxy + enc(url));
  (function next() {
    if (i >= tries.length) { cb(last); return; }
    xhr(tries[i++], function (err, t) {
      if (!err) { cb(null, t); return; }
      last = err;
      if (err.status > 0) { cb(err); return; }
      next();
    });
  })();
}
function netMsg(err) {
  if (!err) return "Erro desconhecido.";
  if (err.status === 0) return "Sem resposta do servidor. Confira o endereço, usuário e senha, e a internet da TV. Se o servidor bloquear o acesso (CORS), defina um proxy em Configurações.";
  if (err.status === 401 || err.status === 403) return "Acesso negado (" + err.status + "). Confira usuário e senha.";
  return "O servidor respondeu com erro " + err.status + ".";
}

/* ---------- parser M3U ---------- */
var EP_RE = /^(.*?)\s*(?:[-–|]\s*)?(?:[Ss](\d{1,2})[\s._-]*[Ee](\d{1,3})|[Tt](\d{1,2})[\s._-]*[Ee](\d{1,3})|Temporada\s*(\d{1,2})\s*Epis[oó]dio\s*(\d{1,3}))(?:\s*[-–:]\s*(.*))?$/i;
var MOVIE_KW = ["filme", "movie", "vod", "cinema", "lancamento", "lançamento", "4k", "uhd", "dublado", "legendado", "document", "animac", "animaç"];
var SERIE_KW = ["serie", "série", "novela", "anime", "temporada", "dorama"];
function isVodExt(u) { return /\.(mp4|mkv|avi|mov|m4v|webm)$/i.test(u.split("?")[0]); }
function anyKw(g, list) { var i; for (i = 0; i < list.length; i++) { if (g.indexOf(list[i]) >= 0) return true; } return false; }
function classify(name, group, url) {
  var lu = url.toLowerCase(), lg = group.toLowerCase();
  if (EP_RE.test(name) || lu.indexOf("/series/") >= 0) return "series";
  if (anyKw(lg, SERIE_KW) && isVodExt(url)) return "series";
  if (lu.indexOf("/movie/") >= 0 || isVodExt(url) || anyKw(lg, MOVIE_KW)) return "movie";
  return "live";
}
function cleanYear(t) {
  var m = t.match(/\s*\((\d{4})\)\s*$/);
  if (m) return { title: t.replace(m[0], "").trim(), year: m[1] };
  return { title: t.trim() };
}
function parseM3U(text, pid) {
  var lines = text.split(/\r?\n/), data = { live: [], vod: [], series: [] };
  var smap = {}, snum = 0, meta = null, n = 0, i, line, m, attrs, re, ci, kind;
  for (i = 0; i < lines.length; i++) {
    line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf("#EXTINF:") === 0) {
      attrs = {}; re = /([a-zA-Z0-9_-]+)="([^"]*)"/g;
      while ((m = re.exec(line)) !== null) attrs[m[1].toLowerCase()] = m[2].trim();
      ci = line.indexOf(",");
      meta = {
        name: (ci >= 0 ? line.slice(ci + 1).trim() : "") || attrs["tvg-name"] || "Canal",
        logo: attrs["tvg-logo"] || "", group: attrs["group-title"] || "Geral",
        chno: attrs["tvg-chno"] || ""
      };
      continue;
    }
    if (line.indexOf("#EXTGRP:") === 0 && meta) { meta.group = line.slice(8).trim() || meta.group; continue; }
    if (line.charAt(0) === "#") continue;
    if (/^https?:\/\//i.test(line)) {
      n++;
      if (!meta) meta = { name: "Stream " + n, logo: "", group: "Geral", chno: "" };
      kind = classify(meta.name, meta.group, line);
      if (kind === "series") {
        var em = meta.name.match(EP_RE), st = meta.name, sn = 1, en = 1, et = meta.name;
        if (em) {
          st = (em[1] || "").trim() || meta.name;
          sn = Number(em[2] || em[4] || em[6] || 1);
          en = Number(em[3] || em[5] || em[7] || 1);
          et = (em[8] || "").trim() || ("Episódio " + en);
        }
        var cy = cleanYear(st), key = cy.title.toLowerCase(), s = smap[key];
        if (!s) {
          snum++;
          s = { kind: "series", id: pid + "-s" + snum, title: cy.title, poster: meta.logo, cat: meta.group, year: cy.year || "", seasons: {}, loaded: true };
          smap[key] = s; data.series.push(s);
        }
        if (!s.poster && meta.logo) s.poster = meta.logo;
        if (!s.seasons[sn]) s.seasons[sn] = [];
        s.seasons[sn].push({ id: s.id + "e" + sn + "x" + en + "n" + n, season: sn, ep: en, title: et, url: line, thumb: meta.logo });
      } else if (kind === "movie") {
        var my = cleanYear(meta.name);
        data.vod.push({ kind: "movie", id: pid + "-m" + n, title: my.title, poster: meta.logo, cat: meta.group, url: line, year: my.year || "" });
      } else {
        data.live.push({ kind: "live", id: pid + "-c" + n, name: meta.name, logo: meta.logo, cat: meta.group, url: line, num: meta.chno || pad2(0) + String(data.live.length + 1) });
      }
      meta = null;
    }
  }
  var k, sk;
  for (k = 0; k < data.series.length; k++) {
    for (sk in data.series[k].seasons) {
      if (data.series[k].seasons.hasOwnProperty(sk)) {
        data.series[k].seasons[sk].sort(function (a, b) { return a.ep - b.ep; });
      }
    }
  }
  return data;
}

/* ---------- biblioteca estática (M3U e demo) ---------- */
function buildStatic(data) {
  var lib = { type: "static", data: data, cats: {}, by: {} };
  var kinds = ["live", "vod", "series"], ki;
  for (ki = 0; ki < kinds.length; ki++) {
    (function (k) {
      var map = {}, order = [], list = data[k], j, c;
      for (j = 0; j < list.length; j++) {
        c = list[j].cat || "Geral";
        if (!map.hasOwnProperty(c)) { map[c] = []; order.push(c); }
        map[c].push(list[j]);
      }
      lib.by[k] = map;
      lib.cats[k] = [{ id: "*", name: "Todos", count: list.length }];
      for (j = 0; j < order.length; j++) lib.cats[k].push({ id: order[j], name: order[j], count: map[order[j]].length });
    })(kinds[ki]);
  }
  lib.items = function (k, cid, cb) { cb(cid === "*" ? data[k] : (lib.by[k][cid] || [])); };
  lib.all = function (cb) { cb(data); };
  lib.detail = function (s, cb) { cb(s); };
  return lib;
}

/* ---------- Xtream ---------- */
function normBase(s) {
  s = String(s || "").trim();
  if (!/^https?:\/\//i.test(s)) s = "http://" + s;
  return s.replace(/\/player_api\.php.*$/i, "").replace(/\/+$/, "");
}
function xtCall(xt, action, extra, cb) {
  var url = xt.base + "/player_api.php?username=" + enc(xt.u) + "&password=" + enc(xt.p);
  if (action) url += "&action=" + action;
  if (extra) url += extra;
  fetchText(url, function (err, t) {
    if (err) { cb(err); return; }
    var j;
    try { j = JSON.parse(t); } catch (e) { cb({ status: 200, msg: "resposta inválida" , bad: true}); return; }
    cb(null, j);
  });
}

    if (mode === "xtream") {
      if (!fServer.value.trim() || !fUser.value.trim() || !fPass.value.trim()) { msg.textContent = "Preencha servidor, usuário e senha."; return; }
      spec = { type: "xtream", server: normBase(fServer.value), user: fUser.value.trim(), pass: fPass.value.trim() };
    } else {
      var u = fUrl.value.trim();
      if (!/^https?:\/\//i.test(u)) { if (!u) { msg.textContent = "Informe o endereço da lista."; return; } u = "http://" + u; }
      var xm = u.match(/^(https?:\/\/[^\/?#]+)\/get\.php\?(.*)$/i), un, pw;
      if (xm) { un = /(?:^|&)username=([^&]*)/.exec(xm[2]); pw = /(?:^|&)password=([^&]*)/.exec(xm[2]); }
      if (xm && un && pw) spec = { type: "xtream", server: normBase(xm[1]), user: decodeURIComponent(un[1]), pass: decodeURIComponent(pw[1]) };
      else spec = { type: "m3u", url: u };
    }
    spec.id = "p" + new Date().getTime();
    spec.name = fName.value.trim() || (spec.type === "xtream" ? spec.server.replace(/^https?:\/\//i, "") : "Lista M3U");
    busy = true; msg.style.color = "#cfd3da"; msg.textContent = "Conectando… pode levar alguns instantes.";
    buildLib(spec, function (err, lib) {
      busy = false; msg.style.color = "";
      if (!modalOpen()) return;
      if (err) { msg.textContent = (err.msg && err.status !== 0 ? err.msg : netMsg(err)); return; }
      S.playlists.push(spec); S.activeId = spec.id; S.libCache[spec.id] = lib; S.lib = lib; savePlaylists();
      S.loadToken++;
      closeModal(); S.section = "home"; renderSide(); render(); focusMain();
      toast("Lista conectada!");
    });
  });
  body.appendChild(go1); body.appendChild(button("Cancelar", "", closeModal));
  panel.appendChild(body); openModal(panel);
}

/* ---------- teclado / controle ---------- */
function isBack(c) { return c === 10009 || c === 27 || c === 461 || c === 8; }
document.addEventListener("keydown", function (e) {
  var c = e.keyCode, t = e.target, inInput = t && t.tagName === "INPUT";
  if (!$("#boot").getAttribute("data-gone") && $("#boot").parentNode) return;
  if (P.open) {
    if (isBack(c)) { e.preventDefault(); closePlayer(); return; }
    e.preventDefault(); playerKey(c); return;
  }
  if (!$("#loading").className.match(/hide/)) { if (isBack(c)) { S.loadToken++; hideLoading(); } e.preventDefault(); return; }
  if (c === 8 && inInput) return;
  if (isBack(c)) {
    e.preventDefault();
    if (modalOpen()) { closeModal(); return; }
    if (S.section !== "home") { go("home"); return; }
    try { window.tizen.application.getCurrentApplication().exit(); } catch (x) { try { history.back(); } catch (y) {} }
    return;
  }
  if (c === 37 || c === 39) {
    if (inInput) { var v = t.value, p = t.selectionStart; if (c === 37 && p > 0) return; if (c === 39 && p < v.length) return; }
    e.preventDefault(); move(c === 37 ? "left" : "right"); return;
  }
  if (c === 38) { e.preventDefault(); move("up"); return; }
  if (c === 40) { e.preventDefault(); move("down"); return; }
  if (c === 13) {
    if (inInput) return;
    var a = document.activeElement;
    if (a && a.classList && a.classList.contains("f")) { e.preventDefault(); a.click(); }
  }
}, true);

/* ---------- início ---------- */
function registerKeys() {
  try {
    var names = ["MediaPlayPause", "MediaPlay", "MediaPause", "MediaStop", "MediaRewind", "MediaFastForward", "ChannelUp", "ChannelDown"];
    names.forEach(function (n) { try { window.tizen.tvinputdevice.registerKey(n); } catch (e) {} });
  } catch (e2) {}
}
function init() {
  S.playlists = jget("croma.pl", []);
  S.activeId = jget("croma.active", null);
  S.cw = jget("croma.cw", []);
  S.settings = jget("croma.set", { proxy: "" });
  if (!allPlaylists().some(function (p) { return p.id === S.activeId; })) S.activeId = S.playlists.length ? S.playlists[S.playlists.length - 1].id : "demo";
  registerKeys(); initPlayer();
  setInterval(function () { var c = $("#clock"); if (c) c.textContent = clockStr(); }, 20000);
  renderSide();
  var boot = $("#boot"); boot.setAttribute("data-gone", "1"); boot.style.display = "none";
  loadActive(function () { render(); focusMain(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
